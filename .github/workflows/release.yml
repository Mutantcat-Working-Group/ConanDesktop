name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.0.20260920'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and all version sources
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/release.py validate --tag "$RELEASE_TAG"
          python -m unittest discover -s tests -p 'test_release.py'

  build:
    needs: validate
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check versions and tests
        shell: bash
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      # Tauri copies the binary into the installer as-is, so the exe has to be
      # signed before the bundle step runs.
      - name: Build release binary
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Sign Windows application binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'mutantcat-code-signing.pfx'
          $password = 'mutantcat'
          $cert = New-SelfSignedCertificate `
            -Subject 'CN=Mutantcat Working Group, O=Mutantcat Working Group, C=CN' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $signtool = $null
          foreach ($kit in (Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Sort-Object Name -Descending)) {
            $candidate = Join-Path $kit.FullName 'x64\signtool.exe'
            if (Test-Path $candidate) { $signtool = $candidate; break }
          }
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $target = "src-tauri/target/${{ matrix.target }}/release/tauri-app.exe"
          if (-not (Test-Path $target)) { throw "missing $target" }
          & $signtool sign /fd SHA256 /f $pfx /p $password /d "Conan Desktop" "$target"
          echo "signed $target"

      - name: Build installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_PATH -or -not $env:SIGNTOOL_PATH) { throw 'code-signing setup did not run' }
          $app = "src-tauri/target/${{ matrix.target }}/release/tauri-app.exe"
          $signature = Get-AuthenticodeSignature $app
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notlike '*CN=Mutantcat Working Group*') { throw "$app lost its signature during bundling ($($signature.Status))" }
          Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter *.exe | ForEach-Object {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d "Conan Desktop Installer" "$($_.FullName)"
            echo "signed $($_.Name)"
          }
          if (-not (Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter *.exe)) { throw 'no NSIS installer found' }
      - name: Verify app and ad-hoc sign DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$TARGET/release/bundle/macos/Conan Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          shopt -s nullglob
          images=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          codesign --force --sign - --timestamp=none "${images[0]}"
          codesign --verify --strict --verbose=2 "${images[0]}"
          codesign -dv --verbose=4 "${images[0]}" 2>&1 | grep -F 'Signature=adhoc'
          hdiutil verify "${images[0]}"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${images[0]}"
          test -L "$mount/Applications"
          hdiutil detach "$mount"
      - name: Verify AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          chmod +x "${images[0]}"
          "${images[0]}" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
      - name: Collect named installer
        run: python scripts/release.py collect --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Require all four installers and generate checksums
        run: python scripts/release.py checksums
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Conan Desktop $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
